tools:
  - name: clarify
    description: "Ask the user one clarifying question and wait for the next turn."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Question to ask the user"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Expected response type"}
        options: {type: array, default: [], items: {type: string}, description: "Options for choice responses"}
      required: [question]

  - name: timeline
    description: "Get recent posts from a social account by screenname."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Account screenname without @"}
        limit: {type: integer, default: 5, description: "Number of posts"}
      required: [screenname]

  - name: social_search
    description: "Search social posts by keyword or topic."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Latest or Top results"}
        limit: {type: integer, default: 5, description: "Number of posts"}
      required: [query]

  - name: lookup
    description: "Search the web for general or news information."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query"}
        topic: {type: string, enum: [general, news], default: "general", description: "Search topic"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Freshness window"}
        max_results: {type: integer, default: 5, description: "Number of results"}
      required: [query]

  - name: fetch
    description: "Read the contents of a specific URL."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL to read"}
      required: [url]

  - name: format
    description: "Format already-collected items into a markdown digest."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Items to format"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output template"}
        headline: {type: string, default: "", description: "Digest headline"}
      required: [items, template]

  - name: reference_builder
    description: "Build references from collected research items in APA, MLA, Chicago, IEEE, BibTeX, or plain format."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Items to convert into references"
          items:
            type: object
            properties:
              title: {type: string}
              authors: {type: array, items: {type: string}}
              author: {type: string}
              year: {type: string}
              source: {type: string}
              publisher: {type: string}
              journal: {type: string}
              url: {type: string}
              doi: {type: string}
        style: {type: string, enum: [apa, mla, chicago, ieee, bibtex, plain], default: "apa", description: "Reference style"}
        include_urls: {type: boolean, default: true, description: "Include URLs when available"}
        title: {type: string, default: "", description: "Heading for the reference list"}
      required: [items, style]

  - name: send
    description: "Send text to Telegram only after the user explicitly confirms. If not confirmed, ask for confirmation first."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Message text"}
        confirmed: {type: boolean, default: false, description: "True only after explicit user confirmation"}
      required: [text]

  - name: policy
    description: "Search local company policy markdown."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Policy search query"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Policy area"}
        top_k: {type: integer, default: 3, description: "Number of results"}
      required: [query]

  - name: papers
    description: "Search arXiv papers."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Paper search query"}
        max_results: {type: integer, default: 5, description: "Number of papers"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort mode"}
      required: [query]

  - name: paper_text
    description: "Download an arXiv PDF and extract local text."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID or URL"}
        max_pages: {type: integer, default: 5, description: "Number of pages"}
        max_chars: {type: integer, default: 8000, description: "Maximum characters"}
      required: [arxiv_url]

  - name: extract_key_points
    description: "Extract concise key points from long text or collected items."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Raw text to analyze"}
        items:
          type: array
          default: []
          description: "Collected research items"
          items:
            type: object
            properties:
              title: {type: string}
              summary: {type: string}
              content: {type: string}
        max_points: {type: integer, default: 5, description: "Maximum number of key points"}
      required: []

  - name: compare_sources
    description: "Compare multiple collected sources and highlight shared and unique terms."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Sources to compare"
          items:
            type: object
            properties:
              title: {type: string}
              summary: {type: string}
              content: {type: string}
              url: {type: string}
              source: {type: string}
        question: {type: string, default: "", description: "Comparison question"}
        max_sources: {type: integer, default: 4, description: "Maximum sources to compare"}
      required: [items]

  - name: source_credibility
    description: "Score basic credibility signals for a source or URL."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Source URL"}
        source: {type: string, default: "", description: "Source label"}
        title: {type: string, default: "", description: "Source title"}
        evidence_text: {type: string, default: "", description: "Supporting excerpt text"}
      required: []
