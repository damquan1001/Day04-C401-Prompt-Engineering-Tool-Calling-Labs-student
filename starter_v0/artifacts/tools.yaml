tools:
  - name: clarify
    description: "Ask the user for missing information and pause. Use when account, URL, arXiv ID, exact content, or action confirmation is missing. For any send/post/publish request, including Vietnamese 'dang/gui/post len Telegram', use response_type=yes_no, not text."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "The concise question to ask the user."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Use text for missing info, yes_no for action confirmation, choice for fixed options."}
        options: {type: array, default: [], items: {type: string}, description: "Choice options when response_type=choice."}
      required: [question, response_type]

  - name: timeline
    description: "Fetch recent posts from one specific Twitter/X account. Use only when the user names a person/account. screenname is the handle without @. Known mappings: Sam Altman=sama, Elon Musk=elonmusk, Andrej Karpathy=karpathy."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Account handle without @, for example sama, elonmusk, karpathy."}
        limit: {type: integer, default: 5, description: "Number of recent posts requested by the user."}
      required: [screenname]

  - name: social_search
    description: "Search Twitter/X posts by topic, keyword, or trend. Use for 'what are people saying' or tweets about a subject, not for a single account. Use search_type=Top for top/popular tweets; otherwise Latest."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Topic or keyword to search, e.g. AI, OpenAI, GPT-5."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top for popular/top tweets, Latest for recent discussion."}
        limit: {type: integer, default: 5, description: "Number of posts to return."}
      required: [query]

  - name: lookup
    description: "Search the public web. Use topic=news for current news. For today/hom nay use timeframe=day; for this week/tuan nay use timeframe=week. Keep query short: use AI for AI news, robotics for robotics news, OpenAI for OpenAI news."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Short search query without adding words like news unless the user specifically asks for that phrase."}
        topic: {type: string, enum: [general, news], default: "general", description: "news for current news, general for non-news discovery."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "day=today, week=this week, month=this month, year=this year."}
        max_results: {type: integer, default: 5, description: "Number of web results."}
      required: [query]

  - name: fetch
    description: "Read the content of a specific URL supplied by the user. Do not use this when the user says 'this article' but provides no URL; ask clarify instead."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Exact URL from the user."}
      required: [url]

  - name: format
    description: "Format already-collected items into markdown. This tool does not search, read URLs, or create facts."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Items already returned by previous tools."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output style."}
        headline: {type: string, default: "", description: "Optional headline."}
      required: [items, template]

  - name: send
    description: "Send text to a Telegram channel. This changes external state. Only call with confirmed=true after explicit yes/no confirmation for the exact text and destination in the current conversation."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Exact message text to send."}
        confirmed: {type: boolean, default: false, description: "Must be true only after explicit user confirmation."}
      required: [text, confirmed]

  - name: policy
    description: "Search internal company policy markdown. Use for company rules about citation, privacy, publishing, tool usage, and research workflow."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Policy question or keywords."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Policy area to search."}
        top_k: {type: integer, default: 3, description: "Number of policy sections."}
      required: [query]

  - name: papers
    description: "Search arXiv for academic papers and preprints. Use for paper discovery, research papers, arXiv searches, and academic literature."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Paper search query."}
        max_results: {type: integer, default: 5, description: "Number of papers."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort order."}
      required: [query]

  - name: paper_text
    description: "Download and extract text from a specific arXiv paper. Use only when the user gives an arXiv ID or URL and asks to read/inspect/extract content."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID or URL, for example 1706.03762."}
        max_pages: {type: integer, default: 5, description: "Number of PDF pages to extract."}
        max_chars: {type: integer, default: 8000, description: "Maximum extracted characters."}
      required: [arxiv_url]

  - name: source_check
    description: "Check already-collected research items for source URL presence and rough citation quality. Does not fetch data. Use when the user asks whether sources/citations are ready or reliable."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Research items already collected from prior tool results."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
        strict: {type: boolean, default: false, description: "When true, require tier_1-like evidence for every item."}
      required: [items]

  - name: extract_key_points
    description: "Extract the most important points from text or already-collected items. Use when the user asks for takeaways, highlights, or a compact summary without fetching new sources."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Source text already present in the conversation or input."}
        items:
          type: array
          default: []
          description: "Optional collected items to analyze together with text."
          items:
            type: object
            properties:
              title: {type: string}
              summary: {type: string}
              content: {type: string}
              url: {type: string}
              source: {type: string}
        max_points: {type: integer, default: 5, description: "Maximum number of key points to return."}

  - name: compare_sources
    description: "Compare two or more already-collected sources for overlap and differences. Use for source triage, contradiction checks, or synthesis planning."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Collected source items to compare."
          items:
            type: object
            properties:
              title: {type: string}
              summary: {type: string}
              content: {type: string}
              url: {type: string}
              source: {type: string}
        question: {type: string, default: "", description: "Optional comparison focus or question."}
        max_sources: {type: integer, default: 4, description: "Maximum number of sources to compare."}

  - name: reference_builder
    description: "Format already-collected source items into citations or bibliography entries. Use for APA, MLA, Chicago, IEEE, BibTeX, or plain references."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Collected source items to format."
          items:
            type: object
            properties:
              title: {type: string}
              authors:
                type: array
                items: {type: string}
              author: {type: string}
              year: {type: string}
              published: {type: string}
              updated: {type: string}
              date: {type: string}
              source: {type: string}
              publisher: {type: string}
              journal: {type: string}
              doi: {type: string}
              url: {type: string}
              link: {type: string}
        style: {type: string, enum: [apa, mla, chicago, ieee, bibtex, plain], default: "apa", description: "Citation style."}
        include_urls: {type: boolean, default: true, description: "Include URLs in non-BibTeX output."}
        title: {type: string, default: "", description: "Optional heading for the reference block."}

  - name: source_credibility
    description: "Score how credible a source URL or source label looks before publishing. Use for quick source triage without fetching the page."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Source URL to inspect."}
        source: {type: string, default: "", description: "Optional source label if no URL is available."}
        title: {type: string, default: "", description: "Optional title or context."}
        evidence_text: {type: string, default: "", description: "Optional excerpt or context text for the source."}
